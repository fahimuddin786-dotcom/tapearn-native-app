<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 TapEarn - Admin Panel</title>
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #1a237e;
            --secondary: #283593;
            --accent: #3949ab;
            --danger: #d32f2f;
            --success: #388e3c;
            --warning: #f57c00;
            --info: #1976d2;
            --light: #f5f5f5;
            --dark: #121212;
            --sidebar: #0d1b2a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #00b09b, #96c93d);
            --gradient-danger: linear-gradient(135deg, #f5576c, #f093fb);
        }

        body {
            background: var(--gradient-primary);
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== ADMIN CONTAINER ===== */
        .admin-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            min-height: 90vh;
        }

        /* ===== SIDEBAR ===== */
        .admin-sidebar {
            width: 280px;
            background: var(--sidebar);
            color: white;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 25px;
            margin-bottom: 40px;
        }

        .admin-logo i {
            font-size: 32px;
            color: #667eea;
            background: white;
            padding: 12px;
            border-radius: 12px;
        }

        .admin-logo h1 {
            font-size: 20px;
            color: white;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 20px 30px;
            border-radius: 12px;
        }

        .admin-user-avatar {
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .admin-user-info h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .admin-user-info p {
            font-size: 12px;
            color: #a0a0a0;
        }

        .admin-nav {
            flex: 1;
            padding: 0 20px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: #b0b0b0;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.3s;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-item.active {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .nav-badge {
            background: var(--danger);
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
        }

        .admin-footer {
            padding: 20px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #a0a0a0;
            text-align: center;
        }

        .admin-footer p {
            margin: 5px 0;
        }

        /* ===== MAIN CONTENT ===== */
        .admin-main {
            flex: 1;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            background: white;
            padding: 25px 30px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h2 {
            color: var(--primary);
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-actions {
            display: flex;
            gap: 12px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-success {
            background: var(--gradient-success);
            color: white;
        }

        .btn-danger {
            background: var(--gradient-danger);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(45deg, #ff9a00, #ff5e00);
            color: white;
        }

        .btn-info {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* ===== CONTENT AREA ===== */
        #adminContent {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* ===== STATS GRID ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--primary);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card.primary { border-left-color: var(--primary); }
        .stat-card.success { border-left-color: var(--success); }
        .stat-card.warning { border-left-color: var(--warning); }
        .stat-card.danger { border-left-color: var(--danger); }
        .stat-card.info { border-left-color: var(--info); }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--dark);
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .stat-icon {
            font-size: 40px;
            opacity: 0.2;
        }

        .stat-change {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .stat-change.positive {
            color: var(--success);
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .quick-action-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }

        .quick-action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .quick-action-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .quick-action-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .quick-action-desc {
            font-size: 13px;
            color: #666;
        }

        /* ===== CHARTS GRID ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .chart-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .chart-header h4 {
            color: var(--dark);
        }

        .chart-placeholder {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-style: italic;
        }

        /* ===== CONTENT CARD ===== */
        .content-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .card-header h3 {
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== TABLES ===== */
        .table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .table-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid #eaeaea;
        }

        .table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .table tr:hover {
            background: #f8f9fa;
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        /* ===== BADGES ===== */
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-primary {
            background: #d1d9ff;
            color: var(--primary);
        }

        /* ===== SEARCH CONTAINER ===== */
        .search-container {
            display: flex;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #eaeaea;
            border-radius: 10px 0 0 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-btn:hover {
            background: var(--secondary);
        }

        /* ===== USER AVATAR ===== */
        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: white;
        }

        .action-view {
            background: #17a2b8;
        }

        .action-edit {
            background: #28a745;
        }

        .action-delete {
            background: #dc3545;
        }

        .action-force {
            background: #6c757d;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.1);
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 25px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            color: var(--dark);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: var(--danger);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-footer {
            padding: 20px 25px;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* ===== NOTIFICATIONS ===== */
        #notificationContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
        }

        .admin-notification {
            background: white;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 300px;
            border-left: 5px solid var(--info);
            animation: slideIn 0.3s ease-out;
            max-width: 350px;
        }

        .notification-success {
            border-left-color: var(--success);
        }

        .notification-error {
            border-left-color: var(--danger);
        }

        .notification-warning {
            border-left-color: var(--warning);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== LOADING ===== */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #666;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #ddd;
        }

        /* ===== TABS ===== */
        .admin-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 5px;
        }

        .admin-tab {
            padding: 12px 25px;
            background: none;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .admin-tab:hover {
            color: var(--primary);
            background: #f8f9fa;
        }

        .admin-tab.active {
            color: var(--primary);
            background: white;
            border-bottom: 3px solid var(--primary);
        }

        /* ===== ANIMATIONS ===== */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FLOATING BUTTONS ===== */
        .admin-launch-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--gradient-primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.6);
            z-index: 9999;
            transition: all 0.3s;
        }

        .admin-launch-btn:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.8);
        }

        .main-app-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: var(--gradient-success);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.6);
            z-index: 9999;
            transition: all 0.3s;
        }

        .main-app-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 176, 155, 0.8);
        }

        /* ===== SPONSOR SYSTEM STYLES ===== */
        .sponsor-node {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            position: relative;
            min-width: 150px;
        }

        .sponsor-node .node-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .sponsor-node .node-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .sponsor-children {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            position: relative;
        }

        .sponsor-children::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            width: 2px;
            height: 10px;
            background: #667eea;
            transform: translateX(-50%);
        }

        .badge-commission {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white;
        }

        .badge-referral {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .sponsor-level-1 {
            border-color: #667eea;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .sponsor-level-2 {
            border-color: #00b09b;
            background: linear-gradient(45deg, rgba(0, 176, 155, 0.1), rgba(150, 201, 61, 0.1));
        }

        .sponsor-level-3 {
            border-color: #ff9a00;
            background: linear-gradient(45deg, rgba(255, 154, 0, 0.1), rgba(255, 94, 0, 0.1));
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 1024px) {
            .admin-container {
                flex-direction: column;
            }
            
            .admin-sidebar {
                width: 100%;
                padding: 20px;
            }
            
            .admin-nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .nav-item {
                margin-bottom: 0;
            }
        }

        @media (max-width: 768px) {
            .stats-grid,
            .quick-actions,
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .admin-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .admin-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .btn {
                flex: 1;
                justify-content: center;
            }
        }

        @media (max-width: 576px) {
            body {
                padding: 10px;
            }
            
            .admin-nav {
                grid-template-columns: 1fr;
            }
            
            .table-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="admin-sidebar">
            <div class="admin-logo">
                <i class="fas fa-cogs"></i>
                <h1>TapEarn Admin</h1>
            </div>

            <div class="admin-user">
                <div class="admin-user-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="admin-user-info">
                    <h3 id="adminUserName">Loading...</h3>
                    <p id="adminUserRole">Administrator</p>
                </div>
            </div>

            <div class="admin-nav">
                <a href="#" class="nav-item active" onclick="showDashboard()">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" onclick="showUsers()">

    <script>
        // Global variables
        let adminData = {
            users: [],
            transactions: [],
            miningPools: [],
            serverStats: {},
            lastUpdated: null
        };

        // ✅ FIXED: Optimized notification system - Reduced spam
        let lastNotificationTime = 0;
        let notificationQueue = [];
        let notificationTimer = null;
        const NOTIFICATION_COOLDOWN = 3000; // 3 seconds between similar notifications

        // ✅ FIXED: Dynamic server base detection
        function getServerBase() {
            const currentHost = window.location.hostname;
            const currentPort = window.location.port;
            const currentProtocol = window.location.protocol;
            
            console.log('🌍 Current location:', window.location.href);
            
            // If we're on render.com, use render.com server
            if (currentHost.includes('render.com') || currentHost.includes('tapearn-native-app')) {
                console.log('🟢 Using online server (Render.com)');
                return 'https://tapearn-native-app.onrender.com';
            }
            
            // If we're on localhost, use local server
            if (currentHost === 'localhost' || currentHost === '127.0.0.1') {
                console.log('🔵 Using local server (localhost)');
                return `http://${currentHost}:${currentPort || '3000'}`;
            }
            
            // Fallback
            console.log('⚠️ Using fallback server');
            return window.location.origin || 'http://localhost:3000';
        }

        // Initialize with current server
        const CURRENT_SERVER_BASE = getServerBase();
        console.log('🚀 Current Server Base:', CURRENT_SERVER_BASE);

        // ✅ FIXED: Enhanced cross-browser communication
        function setupUniversalCrossBrowserSync() {
            console.log('🌐 Setting up UNIVERSAL cross-browser sync...');
            
            // ✅ Method 1: localStorage events (same browser, different tabs)
            window.addEventListener('storage', function(event) {
                console.log('📡 Storage event from another tab:', event.key);
                
                if (event.key === 'registeredUsers') {
                    try {
                        const newUsers = JSON.parse(event.newValue || '[]');
                        console.log(`🔄 Users updated from another tab: ${newUsers.length} users`);
                        
                        const filteredUsers = filterDeletedUsers(newUsers);
                        adminData.users = filteredUsers;
                        document.getElementById('userCountBadge').textContent = filteredUsers.length;
                        
                        refreshCurrentView();
                        showNotification(`🔄 ${newUsers.length} users synced from another tab`, 'info');
                    } catch (error) {
                        console.error('Error processing storage event:', error);
                    }
                }
            });

            // ✅ Method 2: BroadcastChannel API (modern browsers)
            if (typeof BroadcastChannel !== 'undefined') {
                try {
                    const userChannel = new BroadcastChannel('tapearn_users_channel');
                    const adminChannel = new BroadcastChannel('tapearn_admin_channel');
                    
                    // Listen for messages
                    userChannel.onmessage = function(event) {
                        console.log('📡 BroadcastChannel message:', event.data);
                        
                        if (event.data.type === 'user_registered') {
                            const newUser = event.data.user;
                            console.log('🆕 New user from BroadcastChannel:', newUser.email);
                            
                            // Add to adminData if not exists
                            const userExists = adminData.users.some(u => 
                                u.email === newUser.email || 
                                u.username === newUser.username
                            );
                            
                            if (!userExists) {
                                adminData.users.push(newUser);
                                document.getElementById('userCountBadge').textContent = adminData.users.length;
                                refreshCurrentView();
                                showNotification(`🆕 ${newUser.email} registered via BroadcastChannel`, 'success');
                            }
                        }
                    };
                    
                    adminChannel.onmessage = function(event) {
                        if (event.data.type === 'refresh_request') {
                            console.log('🔄 Refresh request from another admin');
                            loadAdminData();
                        }
                    };
                    
                    console.log('✅ BroadcastChannel setup complete');
                } catch (error) {
                    console.error('BroadcastChannel error:', error);
                }
            }

            // ✅ Method 3: Server polling with timestamp comparison
            let lastSyncTime = localStorage.getItem('lastUserSyncTime') || 0;
            
            setInterval(async () => {
                try {
                    const serverBase = getServerBase();
                    const response = await fetch(`${serverBase}/api/admin/user-sync-check?since=${lastSyncTime}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success && data.newUsers > 0) {
                            console.log(`🔄 Server reports ${data.newUsers} new users since last sync`);
                            await loadAdminData();
                            localStorage.setItem('lastUserSyncTime', Date.now());
                        }
                    }
                } catch (error) {
                    console.log('Server sync check failed:', error.message);
                }
            }, 10000); // Every 10 seconds

            // ✅ Method 4: Window focus detection
            window.addEventListener('focus', function() {
                console.log('🎯 Window focused, checking for updates...');
                loadAdminData();
            });
            
            // ✅ Method 5: Periodic full sync
            setInterval(() => {
                console.log('🔄 Periodic full sync...');
                loadAdminData();
            }, 30000); // Every 30 seconds
        }

        // ✅ Enhanced user registration broadcast
        function broadcastUserRegistrationUniversal(userData) {
            try {
                // Method 1: localStorage event
                localStorage.setItem('userRegistrationEvent', JSON.stringify({
                    type: 'user_registered',
                    user: userData,
                    timestamp: Date.now(),
                    source: window.location.hostname
                }));
                
                // Method 2: BroadcastChannel
                if (typeof BroadcastChannel !== 'undefined') {
                    try {
                        const channel = new BroadcastChannel('tapearn_users_channel');
                        channel.postMessage({
                            type: 'user_registered',
                            user: userData,
                            timestamp: Date.now()
                        });
                        channel.close();
                    } catch (error) {
                        console.error('BroadcastChannel post error:', error);
                    }
                }
                
                // Method 3: Trigger custom event
                const event = new CustomEvent('userRegisteredUniversal', {
                    detail: { user: userData }
                });
                window.dispatchEvent(event);
                
                console.log('📢 Universal user registration broadcast complete');
                
            } catch (error) {
                console.error('Error in universal broadcast:', error);
            }
        }

        // ✅ UPDATED: Initialize admin panel - Data source ko fix kiya
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Admin Panel Initializing...');
            console.log('🌍 Current URL:', window.location.href);
            console.log('🔧 Server Base:', getServerBase());
            
            checkAdminAuth();
            
            // Load data
            loadAdminData();
            
            // ✅ Delete kiye gaye users ka tracking
            initializeDeletedUsersTracker();

            // ✅ Setup universal cross-browser sync
            setupUniversalCrossBrowserSync();

            // ✅ Listen for universal user registration events
            window.addEventListener('userRegisteredUniversal', function(event) {
                console.log('🎯 Universal user registration event:', event.detail);
                
                const newUser = event.detail.user;
                const userExists = adminData.users.some(u => 
                    u.email === newUser.email || 
                    u.username === newUser.username
                );
                
                if (!userExists) {
                    adminData.users.push(newUser);
                    document.getElementById('userCountBadge').textContent = adminData.users.length;
                    refreshCurrentView();
                    showNotification(`🆕 ${newUser.email} registered (Universal Sync)`, 'success');
                }
            });
            
            // ✅ Setup focus/blur detection
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    console.log('👁️ Page visible, syncing data...');
                    loadAdminData();
                }
            });

            // ✅ STEP 1: Enhanced storage event listener for ALL browsers
            window.addEventListener('storage', function(event) {
                console.log('🔁 Storage event from another browser:', event.key, event.newValue);
                
                if (event.key === 'registeredUsers') {
                    try {
                        const newUsers = JSON.parse(event.newValue || '[]');
                        console.log(`🔄 Users updated from storage: ${newUsers.length} users`);
                        
                        // Filter deleted users
                        const filteredUsers = filterDeletedUsers(newUsers);
                        
                        // Update adminData
                        adminData.users = filteredUsers;
                        document.getElementById('userCountBadge').textContent = filteredUsers.length;
                        
                        // Refresh current view
                        refreshCurrentView();
                        
                        // Show notification
                        showNotification(`🔄 ${newUsers.length} users synced from another browser`, 'info');
                        
                    } catch (error) {
                        console.error('Error processing storage event:', error);
                    }
                }
                
                // Handle user login events
                if (event.key === 'userLoginEvent') {
                    try {
                        const loginData = JSON.parse(event.newValue || '{}');
                        if (loginData.userId) {
                            showNotification(`🔓 User logged in: ${loginData.userId}`, 'success');
                        }
                    } catch (error) {
                        console.error('Error processing login event:', error);
                    }
                }
                
                // Handle user registration events
                if (event.key === 'userRegistrationEvent') {
                    try {
                        const regData = JSON.parse(event.newValue || '{}');
                        if (regData.userId) {
                            showNotification(`🆕 New user registered: ${regData.userId}`, 'success');
                            // Force reload users
                            loadAdminData();
                        }
                    } catch (error) {
                        console.error('Error processing registration event:', error);
                    }
                }
            });

            // ✅ Listen for custom cross-browser events
            window.addEventListener('userRegisteredCrossBrowser', function(event) {
                console.log('🎯 User registered event received:', event.detail);
                loadAdminData(); // Reload data
            });

            // ✅ Setup enhanced real-time sync
            setTimeout(() => {
                setupEnhancedRealTimeSync();
            }, 2000);
            
            // Check server status every 30 seconds
            setInterval(checkServerStatus, 30000);
            
            // Auto-sync every 60 seconds
            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    syncFromAllServers();
                }
            }, 60000);
            
            console.log('✅ Admin Panel Initialized');
        });

        // ✅ FIXED: Deleted users ko track karne ke liye
        function initializeDeletedUsersTracker() {
            if (!localStorage.getItem('deletedUsers')) {
                localStorage.setItem('deletedUsers', JSON.stringify([]));
            }
        }

        // ✅ FIXED: Permanent delete kiye gaye users ki list
        function addToDeletedUsers(userId) {
            const deletedUsers = JSON.parse(localStorage.getItem('deletedUsers') || '[]');
            const idStr = userId?.toString()?.toLowerCase();
            if (idStr && !deletedUsers.includes(idStr)) {
                deletedUsers.push(idStr);
                localStorage.setItem('deletedUsers', JSON.stringify(deletedUsers));
            }
        }

        // ✅ FIXED: Filter deleted users function
        function filterDeletedUsers(users) {
            const deletedUsers = JSON.parse(localStorage.getItem('deletedUsers') || '[]');
            const deletedUsersSet = new Set(deletedUsers.map(id => id?.toString()?.toLowerCase()));
            
            return users.filter(user => {
                const userIdentifiers = [
                    user.email,
                    user.id?.toString(),
                    user.username,
                    user.email?.toLowerCase(),
                    user.username?.toLowerCase()
                ].filter(Boolean);
                
                return !userIdentifiers.some(id => 
                    deletedUsersSet.has(id?.toString()?.toLowerCase())
                );
            });
        }

        // ✅ STEP 2: Enhanced broadcast function for user registration
        function broadcastUserRegistration(userEmail, username) {
            try {
                const broadcastData = {
                    type: 'user_registered',
                    userEmail: userEmail,
                    username: username,
                    timestamp: Date.now(),
                    source: 'main_app',
                    action: 'registration'
                };
                
                // Store in localStorage for other browsers
                localStorage.setItem('userRegistrationEvent', JSON.stringify(broadcastData));
                
                // Also store in a temporary key that will trigger storage event
                localStorage.setItem('cross_browser_sync_message', JSON.stringify({
                    type: 'user_registered',
                    userEmail: userEmail,
                    username: username,
                    timestamp: Date.now()
                }));
                
                // Create custom event for current window
                const event = new CustomEvent('userRegisteredCrossBrowser', {
                    detail: broadcastData
                });
                window.dispatchEvent(event);
                
                console.log('📢 Broadcasted user registration:', userEmail);
                
            } catch (error) {
                console.error('Error broadcasting registration:', error);
            }
        }

        // ✅ STEP 3: Enhanced broadcast function for user login
        function broadcastUserLogin(userEmail, username) {
            try {
                const broadcastData = {
                    type: 'user_login',
                    userEmail: userEmail,
                    username: username,
                    timestamp: Date.now(),
                    source: 'main_app',
                    action: 'login'
                };
                
                // Store in localStorage for other browsers
                localStorage.setItem('userLoginEvent', JSON.stringify(broadcastData));
                
                // Also store in cross browser sync
                localStorage.setItem('cross_browser_sync_message', JSON.stringify({
                    type: 'user_login',
                    userEmail: userEmail,
                    timestamp: Date.now()
                }));
                
                console.log('📢 Broadcasted user login:', userEmail);
                
            } catch (error) {
                console.error('Error broadcasting login:', error);
            }
        }

        // ✅ STEP 6: Function to check cross-browser messages
        function checkCrossBrowserMessages() {
            try {
                // Check for sync messages
                const syncMsg = localStorage.getItem('cross_browser_sync_message');
                if (syncMsg) {
                    const message = JSON.parse(syncMsg);
                    console.log('📨 Cross-browser message:', message);
                    
                    if (message.type === 'user_registered') {
                        showNotification(`🆕 New user registered: ${message.userEmail}`, 'success');
                        loadAdminData();
                    }
                    
                    if (message.type === 'user_login') {
                        showNotification(`🔓 User logged in: ${message.userEmail}`, 'info');
                    }
                    
                    // Clear message
                    localStorage.removeItem('cross_browser_sync_message');
                }
                
                // Check for multi-tab sync
                const syncPacket = localStorage.getItem('multi_tab_sync_packet');
                if (syncPacket) {
                    const packet = JSON.parse(syncPacket);
                    console.log('🔄 Multi-tab sync packet received');
                    
                    if (packet.users) {
                        const filteredUsers = filterDeletedUsers(packet.users);
                        adminData.users = filteredUsers;
                        document.getElementById('userCountBadge').textContent = filteredUsers.length;
                        
                        // Refresh view
                        refreshCurrentView();
                    }
                    
                    // Clear packet
                    localStorage.removeItem('multi_tab_sync_packet');
                }
                
            } catch (error) {
                console.error('Error checking messages:', error);
            }
        }

        // ✅ STEP 7: Function to refresh current view
        function refreshCurrentView() {
            const adminHeader = document.querySelector('.admin-header h2');
            if (!adminHeader) return;
            
            const headerText = adminHeader.textContent || adminHeader.innerText;
            
            if (headerText.includes('Users') || headerText.includes('Dashboard')) {
                if (headerText.includes('Users')) {
                    showUsers();
                } else if (headerText.includes('Dashboard')) {
                    showDashboard();
                }
            }
        }

        // ✅ STEP 8: Function to broadcast data to other tabs
        function broadcastToOtherTabs(dataType, data) {
            try {
                const broadcastData = {
                    type: dataType,
                    data: data,
                    timestamp: Date.now(),
                    source: 'admin_panel',
                    adminUser: document.getElementById('adminUserName').textContent
                };
                
                // Store in localStorage
                localStorage.setItem('admin_broadcast', JSON.stringify(broadcastData));
                
                // Also store in a temporary key
                localStorage.setItem('admin_sync_' + Date.now(), JSON.stringify(broadcastData));
                
                console.log('📢 Broadcasted to other tabs:', dataType);
                
            } catch (error) {
                console.error('Error broadcasting:', error);
            }
        }

        // ✅ STEP 5: Enhanced periodic sync with server - OPTIMIZED VERSION
        function setupEnhancedRealTimeSync() {
            console.log('🔄 Setting up OPTIMIZED real-time sync...');
            
            // Immediate sync on page focus
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    console.log('👁️ Page became visible, syncing data...');
                    loadAdminData();
                }
            });
            
            // Listen for window focus
            window.addEventListener('focus', function() {
                console.log('🎯 Window focused, syncing data...');
                loadAdminData();
            });
            
            // Optimized server polling with debouncing
            let isPolling = false;
            setInterval(async () => {
                if (isPolling) return;
                isPolling = true;
                
                try {
                    const serverBase = getServerBase();
                    const response = await fetch(`${serverBase}/api/get-all-users`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            const filteredUsers = filterDeletedUsers(data.users);
                            
                            // Check if user count changed
                            if (filteredUsers.length !== adminData.users.length) {
                                console.log(`🔄 User count changed: ${adminData.users.length} → ${filteredUsers.length}`);
                                
                                // Update data
                                adminData.users = filteredUsers;
                                document.getElementById('userCountBadge').textContent = filteredUsers.length;
                                
                                // Update localStorage for other tabs
                                localStorage.setItem('registeredUsers', JSON.stringify(filteredUsers));
                                
                                // Refresh view
                                refreshCurrentView();
                                
                                // Show notification only if significant change
                                if (Math.abs(filteredUsers.length - adminData.users.length) > 2) {
                                    showNotification(`🔄 Users updated: ${filteredUsers.length} total`, 'info');
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.log('⚠️ Server polling failed:', error.message);
                } finally {
                    isPolling = false;
                }
            }, 15000); // Poll every 15 seconds (optimized)
            
            // Also check for cross-browser messages
            setInterval(() => {
                checkCrossBrowserMessages();
            }, 10000); // Every 10 seconds
        }

        // Check admin authentication
        function checkAdminAuth() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            const ADMIN_AUTHORIZED_USERS = [
                'admin@tapearn.com',
                'admin@example.com',
                'superuser@tapearn.com',
                'system_admin',
                'developer',
                'admin'
            ];

            if (!currentUser.email && !currentUser.username) {
                alert('❌ No user logged in! Redirecting to main app...');
                window.location.href = 'index.html';
                return;
            }

            const userIdentifier = currentUser.email || currentUser.username || currentUser.id;
            
            if (!ADMIN_AUTHORIZED_USERS.some(authorized => 
                userIdentifier.toLowerCase().includes(authorized.toLowerCase()))) {
                alert('❌ Unauthorized access! Redirecting to main app...');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('adminUserName').textContent = userIdentifier;
        }

        // ✅ FIXED: Load all admin data with deleted users filtering
        async function loadAdminData() {
            showLoading();
            
            try {
                const serverBase = getServerBase();
                console.log('📥 Loading from server:', serverBase);
                
                // ✅ STEP 1: Load users from server (ALL USERS)
                const usersResponse = await fetch(`${serverBase}/api/get-all-users`);
                if (usersResponse.ok) {
                    const usersData = await usersResponse.json();
                    if (usersData.success) {
                        // ✅ FILTER OUT DELETED USERS
                        const filteredUsers = filterDeletedUsers(usersData.users);
                        adminData.users = filteredUsers;
                        document.getElementById('userCountBadge').textContent = filteredUsers.length;
                        
                        // Also update localStorage with filtered data
                        localStorage.setItem('registeredUsers', JSON.stringify(filteredUsers));
                    }
                } else {
                    // If server fails, load from localStorage and filter deleted users
                    const localUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                    const filteredUsers = filterDeletedUsers(localUsers);
                    
                    adminData.users = filteredUsers;
                    document.getElementById('userCountBadge').textContent = filteredUsers.length;
                    console.log('⚠️ Loaded filtered users from localStorage:', filteredUsers.length);
                }

                // ✅ STEP 2: Load transactions from server (ALL TRANSACTIONS)
                const txResponse = await fetch(`${serverBase}/api/get-all-transactions`);
                if (txResponse.ok) {
                    const txData = await txResponse.json();
                    if (txData.success) {
                        adminData.transactions = txData.transactions;
                        document.getElementById('txCountBadge').textContent = txData.transactions.length;
                    }
                } else {
                    const localTransactions = JSON.parse(localStorage.getItem('allUsersTransactions') || '[]');
                    adminData.transactions = localTransactions;
                    document.getElementById('txCountBadge').textContent = localTransactions.length;
                    console.log('⚠️ Loaded transactions from localStorage:', localTransactions.length);
                }

                // Load server stats
                await loadServerStats();

                adminData.lastUpdated = new Date();
                showDashboard();
                showNotification('✅ Admin data loaded successfully!', 'success');
                
            } catch (error) {
                console.error('Error loading admin data:', error);
                showNotification('❌ Failed to load admin data from server', 'error');
                
                // Fallback to localStorage with filtering
                const localUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                const localTransactions = JSON.parse(localStorage.getItem('allUsersTransactions') || '[]');
                
                // Filter out deleted users
                const filteredUsers = filterDeletedUsers(localUsers);
                
                adminData.users = filteredUsers;
                adminData.transactions = localTransactions;
                document.getElementById('userCountBadge').textContent = filteredUsers.length;
                document.getElementById('txCountBadge').textContent = localTransactions.length;
                
                showNotification('⚠️ Using local data (server offline)', 'warning');
                showDashboard();
            }
        }

        // Load server stats
        async function loadServerStats() {
            try {
                const serverBase = getServerBase();
                const response = await fetch(`${serverBase}/api/admin/user-stats`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        adminData.serverStats = data.stats;
                    }
                }
            } catch (error) {
                console.error('Error loading server stats:', error);
            }
        }

        // ✅ MULTI-SERVER SYNC FUNCTION
        async function syncFromAllServers() {
            showNotification('🔄 Syncing from all servers...', 'info');
            
            try {
                const serverBase = getServerBase();
                
                // Try to get users from all servers
                const response = await fetch(`${serverBase}/api/get-all-servers-users`, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.success) {
                        const filteredUsers = filterDeletedUsers(data.users);
                        
                        // Merge with existing users
                        const existingEmails = new Set(adminData.users.map(u => u.email));
                        const newUsers = filteredUsers.filter(user => !existingEmails.has(user.email));
                        
                        if (newUsers.length > 0) {
                            adminData.users = [...adminData.users, ...newUsers];
                            document.getElementById('userCountBadge').textContent = adminData.users.length;
                            
                            // Update localStorage
                            localStorage.setItem('registeredUsers', JSON.stringify(adminData.users));
                            
                            showNotification(`✅ Found ${newUsers.length} new users from ${data.sources.length} servers`, 'success');
                        } else {
                            showNotification('✅ All servers in sync', 'info');
                        }
                        
                        refreshCurrentView();
                    }
                } else {
                    // Fallback: try individual servers
                    await syncFromIndividualServers();
                }
                
            } catch (error) {
                console.error('Multi-server sync error:', error);
                showNotification('⚠️ Multi-server sync failed, trying fallback', 'warning');
                await syncFromIndividualServers();
            }
        }

        // ✅ FALLBACK: Sync from individual servers
        async function syncFromIndividualServers() {
            const servers = [
                { name: 'Local', url: 'http://localhost:3000' },
                { name: 'Online', url: 'https://tapearn-native-app.onrender.com' }
            ];
            
            let totalNewUsers = 0;
            
            for (const server of servers) {
                try {
                    console.log(`🔄 Trying server: ${server.name} (${server.url})`);
                    
                    const response = await fetch(`${server.url}/api/get-all-users`, {
                        mode: 'no-cors' // Use no-cors for cross-origin
                    }).catch(err => {
                        console.log(`❌ Server ${server.name} not accessible:`, err.message);
                        return null;
                    });
                    
                    if (response && response.ok) {
                        const data = await response.json();
                        
                        if (data && data.success && data.users) {
                            const newUsers = data.users.filter(newUser => 
                                !adminData.users.some(existingUser => 
                                    existingUser.email === newUser.email
                                )
                            );
                            
                            if (newUsers.length > 0) {
                                adminData.users = [...adminData.users, ...newUsers];
                                totalNewUsers += newUsers.length;
                                
                                console.log(`✅ Added ${newUsers.length} users from ${server.name}`);
                            }
                        }
                    }
                    
                } catch (error) {
                    console.log(`⚠️ Error syncing from ${server.name}:`, error.message);
                }
            }
            
            if (totalNewUsers > 0) {
                document.getElementById('userCountBadge').textContent = adminData.users.length;
                localStorage.setItem('registeredUsers', JSON.stringify(adminData.users));
                showNotification(`✅ Added ${totalNewUsers} new users from multiple servers`, 'success');
                refreshCurrentView();
            }
        }

        // Helper functions for Sponsor System
        function calculateSponsorLevels(sponsorMap) {
            let maxLevel = 0;
            for (const sponsorId in sponsorMap) {
                const level = calculateSponsorDepth(sponsorId, sponsorMap);
                maxLevel = Math.max(maxLevel, level);
            }
            return maxLevel;
        }

        function calculateSponsorDepth(sponsorId, sponsorMap, depth = 0, visited = new Set()) {
            if (visited.has(sponsorId)) return depth;
            visited.add(sponsorId);
            
            let maxDepth = depth;
            const sponsoredUsers = sponsorMap[sponsorId] || [];
            
            for (const user of sponsoredUsers) {
                if (sponsorMap[user.email || user.id]) {
                    const childDepth = calculateSponsorDepth(user.email || user.id, sponsorMap, depth + 1, visited);
                    maxDepth = Math.max(maxDepth, childDepth);
                }
            }
            
            return maxDepth;
        }

        function loadTopSponsors(sponsorMap) {
            const tableBody = document.getElementById('topSponsorsTable');
            
            const topSponsors = Object.entries(sponsorMap)
                .map(([sponsorId, users]) => {
                    const sponsorData = adminData.users.find(u => u.email === sponsorId || u.id === sponsorId);
                    const commission = adminData.transactions
                        .filter(tx => 
                            (tx.userId === sponsorId || tx.userId === sponsorData?.email) && 
                            tx.category === 'referral' && 
                            tx.type === 'earning'
                        )
                        .reduce((sum, tx) => sum + (tx.amount || 0), 0);
                    
                    const activeUsers = users.filter(u => u.status === 'active').length;
                    const successRate = users.length > 0 ? ((activeUsers / users.length) * 100).toFixed(1) : 0;
                    
                    return {
                        sponsorId,
                        sponsorData,
                        count: users.length,
                        commission,
                        successRate,
                        activeUsers
                    };
                })
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);
            
            if (topSponsors.length === 0) {
                tableBody.innerHTML = `

        function assignRandomSponsors() {
            const usersWithoutSponsor = adminData.users.filter(u => 
                !u.sponsorId || u.sponsorId === 'none' || u.sponsorId === ''
            );
            
            const activeSponsors = adminData.users.filter(u => 
                u.status === 'active' && 
                u.emailVerified && 
                (u.sponsorId || u.sponsorId === '')
            );
            
            if (usersWithoutSponsor.length === 0) {
                showNotification('✅ All users already have sponsors!', 'success');
                return;
            }
            
            if (activeSponsors.length === 0) {
                showNotification('❌ No active sponsors available', 'error');
                return;
            }
            
            if (confirm(`Assign random sponsors to ${usersWithoutSponsor.length} users?`)) {
                let assigned = 0;
                
                usersWithoutSponsor.forEach(user => {
                    const randomSponsor = activeSponsors[Math.floor(Math.random() * activeSponsors.length)];
                    user.sponsorId = randomSponsor.email || randomSponsor.id;
                    assigned++;
                });
                
                // Update localStorage
                const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                registeredUsers.forEach((registeredUser, index) => {
                    const userToUpdate = usersWithoutSponsor.find(u => 
                        u.email === registeredUser.email || u.id === registeredUser.id
                    );
                    if (userToUpdate) {
                        registeredUsers[index].sponsorId = userToUpdate.sponsorId;
                    }
                });
                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
                
                showNotification(`✅ Randomly assigned sponsors to ${assigned} users!`, 'success');
                showSponsorSystem();
            }
        }

        function applyBulkSponsorChanges() {
            const selectedUsers = Array.from(document.getElementById('bulkUsers').selectedOptions).map(opt => opt.value);
            const newSponsorId = document.getElementById('newSponsor').value;
            const reason = document.getElementById('assignmentReason').value || 'Manual admin assignment';
            
            if (selectedUsers.length === 0) {
                showNotification('❌ Please select at least one user', 'error');
                return;
            }
            
            let updated = 0;
            const changes = [];
            
            selectedUsers.forEach(userId => {
                const user = adminData.users.find(u => u.email === userId || u.id === userId);
                if (user) {
                    const oldSponsor = user.sponsorId;
                    user.sponsorId = newSponsorId || null;
                    changes.push({
                        userId,
                        oldSponsor,
                        newSponsor: newSponsorId || 'None',
                        reason
                    });
                    updated++;
                }
            });
            
            // Update localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
            registeredUsers.forEach(registeredUser => {
                const change = changes.find(c => c.userId === registeredUser.email || c.userId === registeredUser.id);
                if (change) {
                    registeredUser.sponsorId = change.newSponsor === 'None' ? null : change.newSponsor;
                }
            });
            localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
            
            // Log the changes
            const sponsorLog = JSON.parse(localStorage.getItem('sponsorChangeLog') || '[]');
            changes.forEach(change => {
                sponsorLog.push({
                    ...change,
                    timestamp: new Date().toISOString(),
                    admin: document.getElementById('adminUserName').textContent
                });
            });
            localStorage.setItem('sponsorChangeLog', JSON.stringify(sponsorLog));
            
            showNotification(`✅ Updated sponsors for ${updated} users!`, 'success');
            closeModal();
            showSponsorSystem();
        }

        function generateSponsorReport() {
            const usersWithSponsor = adminData.users.filter(u => u.sponsorId && u.sponsorId !== 'none' && u.sponsorId !== '');
            const uniqueSponsors = [...new Set(usersWithSponsor.map(u => u.sponsorId))];
            
            const report = {
                generatedAt: new Date().toISOString(),
                totalUsers: adminData.users.length,
                usersWithSponsor: usersWithSponsor.length,
                uniqueSponsors: uniqueSponsors.length,
                commissionSettings: JSON.parse(localStorage.getItem('sponsorCommissionSettings') || '{}'),
                topSponsors: [],
                sponsorNetwork: {}
            };
            
            // Calculate top sponsors
            const sponsorCounts = {};
            usersWithSponsor.forEach(user => {
                sponsorCounts[user.sponsorId] = (sponsorCounts[user.sponsorId] || 0) + 1;
            });
            
            report.topSponsors = Object.entries(sponsorCounts)
                .map(([sponsorId, count]) => ({
                    sponsorId,
                    sponsoredCount: count,
                    sponsorData: adminData.users.find(u => u.email === sponsorId || u.id === sponsorId)
                }))
                .sort((a, b) => b.sponsoredCount - a.count)
                .slice(0, 20);
            
            // Create sponsor network
            usersWithSponsor.forEach(user => {
                if (!report.sponsorNetwork[user.sponsorId]) {
                    report.sponsorNetwork[user.sponsorId] = [];
                }
                report.sponsorNetwork[user.sponsorId].push({
                    userId: user.email || user.id,
                    username: user.username,
                    points: user.points,
                    status: user.status
                });
            });
            
            // Export as JSON
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sponsor_report_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showNotification('✅ Sponsor report generated and downloaded!', 'success');
        }

        function fixSponsorIssues() {
            let issuesFixed = 0;
            
            // Fix 1: Remove self-referrals
            adminData.users.forEach(user => {
                if (user.sponsorId === (user.email || user.id)) {
                    user.sponsorId = null;
                    issuesFixed++;
                }
            });
            
            // Fix 2: Remove invalid sponsor IDs
            adminData.users.forEach(user => {
                if (user.sponsorId && user.sponsorId !== 'none') {
                    const sponsorExists = adminData.users.some(u => 
                        u.email === user.sponsorId || u.id === user.sponsorId
                    );
                    if (!sponsorExists) {
                        user.sponsorId = null;
                        issuesFixed++;
                    }
                }
            });
            
            // Fix 3: Fix duplicate sponsors
            const sponsorMap = {};
            adminData.users.forEach(user => {
                if (user.sponsorId) {
                    if (!sponsorMap[user.sponsorId]) {
                        sponsorMap[user.sponsorId] = [];
                    }
                    sponsorMap[user.sponsorId].push(user);
                }
            });
            
            // Update localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
            registeredUsers.forEach((registeredUser, index) => {
                const updatedUser = adminData.users.find(u => 
                    u.email === registeredUser.email || u.id === registeredUser.id
                );
                if (updatedUser) {
                    registeredUsers[index].sponsorId = updatedUser.sponsorId;
                }
            });
            localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
            
            showNotification(`✅ Fixed ${issuesFixed} sponsor issues!`, 'success');
            showSponsorSystem();
        }

        // ✅ FIXED: Optimized notification system to prevent spam
        function showNotification(message, type = 'info') {
            const now = Date.now();
            const container = document.getElementById('notificationContainer');
            
            // Check cooldown for similar messages
            if (type === 'info') {
                if (now - lastNotificationTime < NOTIFICATION_COOLDOWN) {
                    // Queue the notification instead of showing immediately
                    notificationQueue.push({ message, type, timestamp: now });
                    
                    // Start processing queue if not already started
                    if (!notificationTimer) {
                        notificationTimer = setInterval(processNotificationQueue, 1000);
                    }
                    return;
                }
                lastNotificationTime = now;
            }
            
            // Clear existing similar notifications to avoid duplicates
            const existingNotifications = container.querySelectorAll('.admin-notification');
            existingNotifications.forEach(notification => {
                if (notification.textContent.includes(message.substring(0, 20))) {
                    notification.remove();
                }
            });
            
            // Limit total notifications to prevent clutter
            if (existingNotifications.length >= 3) {
                existingNotifications[0].remove();
            }
            
            const notification = document.createElement('div');
            notification.className = `admin-notification notification-${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                <span style="flex: 1;">${message}</span>
                <button class="notification-close" onclick="this.parentElement.remove()" style="background: none; border: none; color: #666; cursor: pointer; font-size: 16px; padding: 0 5px;">
                    ×
                </button>
            `;
            
            container.appendChild(notification);

            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 5000);
        }
        
        function processNotificationQueue() {
            const now = Date.now();
            
            if (notificationQueue.length === 0) {
                clearInterval(notificationTimer);
                notificationTimer = null;
                return;
            }
            
            // Check if enough time has passed since last notification
            if (now - lastNotificationTime >= NOTIFICATION_COOLDOWN) {
                const nextNotification = notificationQueue.shift();
                if (nextNotification) {
                    showNotification(nextNotification.message, nextNotification.type);
                }
            }
        }

        async function saveUserEdit(userId) {

            const usdt = parseFloat(document.getElementById('editUSDT').value) || 0;

            if (userIndex === -1) {
                showNotification('User not found', 'error');
                return;

            const updatedUser = {
                ...adminData.users[userIndex],
                username: username,
                email: email,
                points: points,
                usdtWallet: usdt,
                inrWallet: inr,
                status: status,
                emailVerified: verified
            };

            // Update local data
            adminData.users[userIndex] = updatedUser;
            
            // Update localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
            const localUserIndex = registeredUsers.findIndex(u => 
                u.email === userId || u.id === userId || u.username === userId
            );
            
            if (localUserIndex !== -1) {
                registeredUsers[localUserIndex] = updatedUser;
                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
                
                // ✅ Broadcast the update to other tabs
                broadcastToOtherTabs('user_updated', updatedUser);
            }

            showNotification('✅ User updated successfully!', 'success');
            closeModal();
            showUsers();
        }

                }
                
                const badge = row.querySelector('.badge');
                if (badge && badge.textContent.toLowerCase() === type) {

                } else {

                }
            });
        }

        function filterByCategory(category) {

            rows.forEach(row => {

                const badges = row.querySelectorAll('.badge');
                let show = false;
                badges.forEach(badge => {

                });
                
                row.style.display = show ? '' : 'none';
