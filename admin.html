        function restoreBackup() {
            if (confirm('Restore from backup? This will overwrite current data.')) {
                const backupKeys = Object.keys(localStorage).filter(key => key.startsWith('tapearn_backup_'));
                if (backupKeys.length > 0) {
                    const latestBackup = backupKeys[backupKeys.length - 1];
                    const backup = JSON.parse(localStorage.getItem(latestBackup));
                    
                    // Restore data
                    adminData.users = backup.users || [];
                    adminData.transactions = backup.transactions || [];
                    localStorage.setItem('registeredUsers', JSON.stringify(backup.users || []));
                    localStorage.setItem('allUsersTransactions', JSON.stringify(backup.transactions || []));
                    if (backup.miningPools) localStorage.setItem('miningPools', JSON.stringify(backup.miningPools));
                    if (backup.referralCodes) localStorage.setItem('allReferrals', JSON.stringify(backup.referralCodes));
                    if (backup.deletedUsers) localStorage.setItem('deletedUsers', JSON.stringify(backup.deletedUsers));
                    
                    // Broadcast the restore to other tabs
                    broadcastToOtherTabs('backup_restored', { backupName: latestBackup });
                    
                    showNotification(`✅ Restored from backup: ${latestBackup}`, 'success');
                    showDashboard();
                } else {
                    showNotification('❌ No backups found!', 'error');
                }
            }
        }

        function updateConversionRates() {
            document.getElementById('modalTitle').textContent = 'Update Conversion Rates';
            const modalBody = document.getElementById('userModalBody');
            modalBody.innerHTML = `
                <h3>Update Conversion Rates</h3>
                <div class="form-group">
                    <label>Points to INR Rate</label>
                    <input type="number" class="form-control" id="pointsToINR" value="10000" placeholder="Points = 100 INR">
                    <small>How many points equal 100 INR</small>
                </div>
                <div class="form-group">
                    <label>INR to USDT Rate</label>
                    <input type="number" class="form-control" id="inrToUSDT" value="85" placeholder="INR = 1 USDT">
                    <small>How many INR equal 1 USDT</small>
                </div>
                <div class="form-group">
                    <label>Minimum Conversion (Points)</label>
                    <input type="number" class="form-control" id="minConversion" value="10000">
                    <small>Minimum points required for conversion</small>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="saveConversionRates()">
                        <i class="fas fa-save"></i> Save Rates
                    </button>
                    <button class="btn btn-secondary" onclick="closeModal()">
                        Cancel
                    </button>
                </div>
            `;
            
            document.getElementById('userModal').classList.add('active');
        }

        function saveConversionRates() {
            const pointsToINR = document.getElementById('pointsToINR').value;
            const inrToUSDT = document.getElementById('inrToUSDT').value;
            const minConversion = document.getElementById('minConversion').value;
            
            // Save to localStorage
            const conversionRates = {
                pointsToINR: pointsToINR,
                inrToUSDT: inrToUSDT,
                minConversion: minConversion,
                updatedAt: new Date().toISOString()
            };
            
            localStorage.setItem('conversionRates', JSON.stringify(conversionRates));
            showNotification('✅ Conversion rates updated!', 'success');
            closeModal();
            showWalletSystem();
        }

        // Reset user password
        function resetUserPassword(userId) {
            const newPassword = Math.random().toString(36).slice(-8);
            
            if (confirm(`Reset password for user ${userId}?\n\nNew password: ${newPassword}\n\nCopy this password before closing!`)) {
                // In a real app, you would send this to server
                // For demo, just show notification
                showNotification(`✅ Password reset for ${userId}\nNew password: ${newPassword}`, 'success');
                
                // Copy to clipboard
                navigator.clipboard.writeText(newPassword).then(() => {
                    console.log('Password copied to clipboard');
                });
            }
        }
        
        // ✅ Server status check function
        async function checkServerStatus() {
            try {
                const serverBase = getServerBase();
                const response = await fetch(`${serverBase}/api/health`);
                if (response.ok) {
                    console.log('Server status: OK');
                } else {
                    console.log('Server status: ERROR');
                }
            } catch (error) {
                console.log('Server status: OFFLINE');
            }
        }
    </script>
</body>
