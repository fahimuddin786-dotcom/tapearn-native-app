<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 TapEarn - Admin Panel</title>
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #1a237e;
            --secondary: #283593;
            --accent: #3949ab;
            --danger: #d32f2f;
            --success: #388e3c;
            --warning: #f57c00;
            --info: #1976d2;
            --light: #f5f5f5;
            --dark: #121212;
            --sidebar: #0d1b2a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #00b09b, #96c93d);
            --gradient-danger: linear-gradient(135deg, #f5576c, #f093fb);
        }

        body {
            background: var(--gradient-primary);
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== ADMIN CONTAINER ===== */
        .admin-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            min-height: 90vh;
        }

        /* ===== SIDEBAR ===== */
        .admin-sidebar {
            width: 280px;
            background: var(--sidebar);
            color: white;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 25px;
            margin-bottom: 40px;
        }

        .admin-logo i {
            font-size: 32px;
            color: #667eea;
            background: white;
            padding: 12px;
            border-radius: 12px;
        }

        .admin-logo h1 {
            font-size: 20px;
            color: white;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 20px 30px;
            border-radius: 12px;
        }

        .admin-user-avatar {
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .admin-user-info h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .admin-user-info p {
            font-size: 12px;
            color: #a0a0a0;
        }

        .admin-nav {
            flex: 1;
            padding: 0 20px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: #b0b0b0;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.3s;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-item.active {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .nav-badge {
            background: var(--danger);
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
        }

        .admin-footer {
            padding: 20px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #a0a0a0;
            text-align: center;
        }

        .admin-footer p {
            margin: 5px 0;
        }

        /* ===== MAIN CONTENT ===== */
        .admin-main {
            flex: 1;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            background: white;
            padding: 25px 30px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h2 {
            color: var(--primary);
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-actions {
            display: flex;
            gap: 12px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-success {
            background: var(--gradient-success);
            color: white;
        }

        .btn-danger {
            background: var(--gradient-danger);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(45deg, #ff9a00, #ff5e00);
            color: white;
        }

        .btn-info {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* ===== CONTENT AREA ===== */
        #adminContent {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* ===== STATS GRID ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--primary);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card.primary { border-left-color: var(--primary); }
        .stat-card.success { border-left-color: var(--success); }
        .stat-card.warning { border-left-color: var(--warning); }
        .stat-card.danger { border-left-color: var(--danger); }
        .stat-card.info { border-left-color: var(--info); }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--dark);
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .stat-icon {
            font-size: 40px;
            opacity: 0.2;
        }

        .stat-change {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .stat-change.positive {
            color: var(--success);
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .quick-action-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }

        .quick-action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .quick-action-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .quick-action-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .quick-action-desc {
            font-size: 13px;
            color: #666;
        }

        /* ===== CHARTS GRID ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .chart-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .chart-header h4 {
            color: var(--dark);
        }

        .chart-placeholder {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-style: italic;
        }

        /* ===== CONTENT CARD ===== */
        .content-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .card-header h3 {
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== TABLES ===== */
        .table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .table-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid #eaeaea;
        }

        .table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .table tr:hover {
            background: #f8f9fa;
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        /* ===== BADGES ===== */
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-primary {
            background: #d1d9ff;
            color: var(--primary);
        }

        /* ===== SEARCH CONTAINER ===== */
        .search-container {
            display: flex;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #eaeaea;
            border-radius: 10px 0 0 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-btn:hover {
            background: var(--secondary);
        }

        /* ===== USER AVATAR ===== */
        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: white;
        }

        .action-view {
            background: #17a2b8;
        }

        .action-edit {
            background: #28a745;
        }

        .action-delete {
            background: #dc3545;
        }

        .action-force {
            background: #6c757d;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.1);
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 25px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            color: var(--dark);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: var(--danger);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-footer {
            padding: 20px 25px;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* ===== NOTIFICATIONS ===== */
        #notificationContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
        }

        .admin-notification {
            background: white;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 300px;
            border-left: 5px solid var(--info);
            animation: slideIn 0.3s ease-out;
            max-width: 350px;
        }

        .notification-success {
            border-left-color: var(--success);
        }

        .notification-error {
            border-left-color: var(--danger);
        }

        .notification-warning {
            border-left-color: var(--warning);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== LOADING ===== */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #666;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #ddd;
        }

        /* ===== TABS ===== */
        .admin-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 5px;
        }

        .admin-tab {
            padding: 12px 25px;
            background: none;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .admin-tab:hover {
            color: var(--primary);
            background: #f8f9fa;
        }

        .admin-tab.active {
            color: var(--primary);
            background: white;
            border-bottom: 3px solid var(--primary);
        }

        /* ===== ANIMATIONS ===== */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FLOATING BUTTONS ===== */
        .admin-launch-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--gradient-primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.6);
            z-index: 9999;
            transition: all 0.3s;
        }

        .admin-launch-btn:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.8);
        }

        .main-app-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: var(--gradient-success);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.6);
            z-index: 9999;
            transition: all 0.3s;
        }

        .main-app-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 176, 155, 0.8);
        }

        /* ===== SPONSOR SYSTEM STYLES ===== */
        .sponsor-node {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            position: relative;
            min-width: 150px;
        }

        .sponsor-node .node-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .sponsor-node .node-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .sponsor-children {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            position: relative;
        }

        .sponsor-children::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            width: 2px;
            height: 10px;
            background: #667eea;
            transform: translateX(-50%);
        }

        .badge-commission {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white;
        }

        .badge-referral {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .sponsor-level-1 {
            border-color: #667eea;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .sponsor-level-2 {
            border-color: #00b09b;
            background: linear-gradient(45deg, rgba(0, 176, 155, 0.1), rgba(150, 201, 61, 0.1));
        }

        .sponsor-level-3 {
            border-color: #ff9a00;
            background: linear-gradient(45deg, rgba(255, 154, 0, 0.1), rgba(255, 94, 0, 0.1));
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 1024px) {
            .admin-container {
                flex-direction: column;
            }
            
            .admin-sidebar {
                width: 100%;
                padding: 20px;
            }
            
            .admin-nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .nav-item {
                margin-bottom: 0;
            }
        }

        @media (max-width: 768px) {
            .stats-grid,
            .quick-actions,
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .admin-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .admin-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .btn {
                flex: 1;
                justify-content: center;
            }
        }

        @media (max-width: 576px) {
            body {
                padding: 10px;
            }
            
            .admin-nav {
                grid-template-columns: 1fr;
            }
            
            .table-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="admin-sidebar">
            <div class="admin-logo">
                <i class="fas fa-cogs"></i>
                <h1>TapEarn Admin</h1>
            </div>

            <div class="admin-user">
                <div class="admin-user-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="admin-user-info">
                    <h3 id="adminUserName">Loading...</h3>
                    <p id="adminUserRole">Administrator</p>
                </div>
            </div>

            <div class="admin-nav">
                <a href="#" class="nav-item active" onclick="showDashboard()">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" onclick="showUsers()">
                    <i class="fas fa-users"></i>

    <script>
        // ========================
        // ✅ DUAL SERVER MANAGEMENT CONFIG
        // ========================
        const ADMIN_SERVERS = {
            online: 'https://tapearn-native-app.onrender.com',
            local: 'http://localhost:3000'
        };

        // ========================
        // ✅ OPTIMIZATION CONFIG
        // ========================
        const OPTIMIZATION_CONFIG = {
            // Refresh intervals
            AUTO_REFRESH_INTERVAL: 30000, // 30 seconds
            SERVER_STATUS_INTERVAL: 60000, // 60 seconds
            FULL_SYNC_INTERVAL: 300000, // 5 minutes
            USER_SYNC_INTERVAL: 15000, // 15 seconds
            
            // Notification cooldowns
            NOTIFICATION_COOLDOWN: 5000, // 5 seconds
            ERROR_NOTIFICATION_COOLDOWN: 10000, // 10 seconds
            SUCCESS_NOTIFICATION_COOLDOWN: 3000, // 3 seconds
            
            // Debounce timers
            SEARCH_DEBOUNCE: 500, // 500ms
            RESIZE_DEBOUNCE: 250, // 250ms
            STORAGE_DEBOUNCE: 1000, // 1 second
            
            // Batch processing
            BATCH_SIZE: 50,
            MAX_NOTIFICATIONS: 3,
            MAX_RETRIES: 2
        };

        // ========================
        // ✅ WEBSOCKET REAL-TIME SYNC
        // ========================
        let adminWebSocket = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;
        const RECONNECT_DELAY = 5000;

        // ✅ Initialize WebSocket connection
        function initWebSocketConnection() {
            const serverBase = getServerBase();
            let wsUrl;
            
            if (serverBase.includes('https://')) {
                wsUrl = serverBase.replace('https://', 'wss://') + '/ws';
            } else {
                wsUrl = serverBase.replace('http://', 'ws://') + '/ws';
            }
            
            try {
                console.log('🔄 Connecting to WebSocket:', wsUrl);
                adminWebSocket = new WebSocket(wsUrl);
                
                adminWebSocket.onopen = () => {
                    console.log('🟢 WebSocket connected to server');
                    reconnectAttempts = 0;
                    showOptimizedNotification('✅ Real-time sync connected', 'success');
                    
                    // Send authentication
                    const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
                    sendWebSocketMessage('admin_auth', {
                        adminId: currentUser.email || currentUser.id,
                        timestamp: Date.now()
                    });
                };
                
                adminWebSocket.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        handleWebSocketMessage(message);
                    } catch (error) {
                        console.error('Error parsing WebSocket message:', error);
                    }
                };
                
                adminWebSocket.onclose = () => {
                    console.log('🔴 WebSocket disconnected');
                    
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        const delay = RECONNECT_DELAY * reconnectAttempts;
                        console.log(`Reconnecting in ${delay/1000} seconds... (Attempt ${reconnectAttempts})`);
                        
                        setTimeout(() => {
                            initWebSocketConnection();
                        }, delay);
                    } else {
                        showOptimizedNotification('⚠️ Real-time sync disconnected. Using fallback refresh.', 'warning');
                    }
                };
                
                adminWebSocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };
                
            } catch (error) {
                console.error('Error creating WebSocket:', error);
            }
        }

        // ✅ Handle WebSocket messages
        function handleWebSocketMessage(message) {
            console.log('📨 WebSocket message received:', message.type);
            
            switch(message.type) {
                case 'user_registered':
                case 'mobile_user_registered':
                    handleNewUser(message.data);
                    break;
                    
                case 'transaction_added':
                    handleNewTransaction(message.data);
                    break;
                    
                case 'user_updated':
                    handleUserUpdate(message.data);
                    break;
                    
                case 'sync_request':
                    optimizedLoadAdminData();
                    break;
                    
                case 'admin_connected':
                    console.log('✅ Admin connected to real-time sync');
                    showOptimizedNotification('✅ Real-time sync active', 'success');
                    break;
                    
                default:
                    console.log('Unknown message type:', message.type);
            }
        }

        // ✅ Handle new user from WebSocket
        function handleNewUser(userData) {
            const userExists = adminData.users.some(user => 
                user.email === userData.user.email || 
                user.username === userData.user.username
            );
            
            if (!userExists) {
                adminData.users.unshift(userData.user);
                document.getElementById('userCountBadge').textContent = adminData.users.length;
                
                // Update UI if on users page
                const currentView = document.querySelector('.admin-header h2').textContent;
                if (currentView.includes('Users') || currentView.includes('Dashboard')) {
                    refreshCurrentView();
                }
                
                showOptimizedNotification(`🆕 ${userData.source === 'mobile' ? '📱 Mobile' : 'Web'} user: ${userData.user.email || userData.user.username}`, 'success');
            }
        }

        // ✅ Handle new transaction
        function handleNewTransaction(transactionData) {
            adminData.transactions.unshift(transactionData);
            document.getElementById('txCountBadge').textContent = adminData.transactions.length;
            
            showOptimizedNotification(`💳 New transaction: ${transactionData.description}`, 'info');
        }

        // ✅ Handle user update
        function handleUserUpdate(updateData) {
            const userIndex = adminData.users.findIndex(user => 
                user.email === updateData.email || 
                user.id === updateData.userId
            );
            
            if (userIndex !== -1) {
                adminData.users[userIndex] = { ...adminData.users[userIndex], ...updateData };
                refreshCurrentView();
            }
        }

        // ✅ Send message to server
        function sendWebSocketMessage(type, data) {
            if (adminWebSocket && adminWebSocket.readyState === WebSocket.OPEN) {
                adminWebSocket.send(JSON.stringify({
                    type: type,
                    data: data,
                    timestamp: Date.now(),
                    source: 'admin_panel'
                }));
            }
        }

        // ========================
        // ✅ MOBILE SYNC FUNCTIONS
        // ========================
        // ✅ Listen for mobile user registrations
        function setupMobileUserListener() {
            // 1. localStorage events
            window.addEventListener('storage', (event) => {
                if (event.key === 'mobile_user_registered') {
                    try {
                        const data = JSON.parse(event.newValue || '{}');
                        if (data.user) {
                            handleMobileUserRegistration(data.user);
                        }
                    } catch (error) {
                        console.error('Error processing mobile storage event:', error);
                    }
                }
            });
            
            // 2. BroadcastChannel
            if (typeof BroadcastChannel !== 'undefined') {
                try {
                    const mobileChannel = new BroadcastChannel('tapearn_mobile_channel');
                    mobileChannel.onmessage = (event) => {
                        if (event.data.type === 'mobile_user_registered') {
                            handleMobileUserRegistration(event.data.user);
                        }
                    };
                } catch (error) {
                    console.error('Mobile BroadcastChannel error:', error);
                }
            }
            
            // 3. Custom events
            window.addEventListener('mobileUserRegistered', (event) => {
                handleMobileUserRegistration(event.detail.user);
            });
            
            console.log('📱 Mobile user listener setup complete');
        }

        // ✅ Handle mobile user registration
        function handleMobileUserRegistration(userData) {
            const userExists = adminData.users.some(user => 
                user.email === userData.email || 
                (user.mobile && userData.mobile && user.mobile === userData.mobile)
            );
            
            if (!userExists) {
                const newUser = {
                    ...userData,
                    id: userData.id || `mobile_${Date.now()}`,
                    points: userData.points || 100,
                    usdtWallet: userData.usdtWallet || 0,
                    inrWallet: userData.inrWallet || 0,
                    status: 'active',
                    emailVerified: false,
                    mobileVerified: !!userData.mobile,
                    registration_date: userData.registeredAt || new Date().toISOString(),
                    source: 'mobile_app',
                    registeredAt: new Date().toISOString()
                };
                
                adminData.users.unshift(newUser);
                document.getElementById('userCountBadge').textContent = adminData.users.length;
                
                // Update localStorage
                const localUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                localUsers.unshift(newUser);
                localStorage.setItem('registeredUsers', JSON.stringify(localUsers));
                
                // Refresh view
                refreshCurrentView();
                
                showOptimizedNotification(`📱 Mobile user registered: ${userData.email || userData.mobile}`, 'success');
            }
        }

        // ✅ Sync mobile users from server
        async function syncMobileUsers() {
            try {
                const serverBase = getServerBase();
                
                const response = await fetch(`${serverBase}/api/mobile/get-all-users`);
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.success && data.users.length > 0) {
                        let newMobileUsers = 0;
                        
                        data.users.forEach(mobileUser => {
                            const exists = adminData.users.some(user => 
                                user.email === mobileUser.email || 
                                user.id === mobileUser._id
                            );
                            
                            if (!exists) {
                                adminData.users.push({
                                    id: mobileUser._id,
                                    email: mobileUser.email,
                                    username: mobileUser.username,
                                    mobile: mobileUser.phone,
                                    points: mobileUser.points,
                                    registration_date: mobileUser.registration_date,
                                    status: mobileUser.status,
                                    source: 'mobile_server'
                                });
                                
                                newMobileUsers++;
                            }
                        });
                        
                        if (newMobileUsers > 0) {
                            document.getElementById('userCountBadge').textContent = adminData.users.length;
                            showOptimizedNotification(`📱 Found ${newMobileUsers} mobile users on server`, 'success');
                            refreshCurrentView();
                        }
                    }
                }
            } catch (error) {
                console.error('Error syncing mobile users:', error);
            }
        }

        // ========================
        // ✅ DUAL SERVER MANAGEMENT
        // ========================
        // ✅ Check both servers
        async function checkAllServers() {
            const results = {};
            
            for (const [name, url] of Object.entries(ADMIN_SERVERS)) {
                try {
                    const response = await fetch(`${url}/api/health`);
                    results[name] = {
                        online: response.ok,
                        url: url,
                        timestamp: new Date().toISOString()
                    };
                } catch (error) {
                    results[name] = {
                        online: false,
                        error: error.message,
                        url: url
                    };
                }
            }
            
            return results;
        }

        // ✅ Sync between servers
        async function syncBetweenServers(fromServer, toServer) {
            try {
                // 1. Get users from source server
                const sourceResponse = await fetch(`${ADMIN_SERVERS[fromServer]}/api/get-all-users`);
                const sourceData = await sourceResponse.json();
                
                if (!sourceData.success) {
                    throw new Error('Failed to get users from source server');
                }
                
                // 2. Sync to target server
                const syncResponse = await fetch(`${ADMIN_SERVERS[toServer]}/api/bulk-sync-users`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        users: sourceData.users,
                        source: `admin_sync_from_${fromServer}`
                    })
                });
                
                const syncResult = await syncResponse.json();
                
                return {
                    success: true,
                    message: `Synced ${syncResult.synced || 0} users from ${fromServer} to ${toServer}`,
                    details: syncResult
                };
                
            } catch (error) {
                return {
                    success: false,
                    error: error.message
                };
            }
        }

        // ✅ Add server management UI to admin panel
        function addServerManagementUI() {
            // Check if already exists
            if (document.querySelector('.server-management')) return;
            
            const serverControls = `
                <div class="server-management" style="
                    position: fixed;
                    bottom: 100px;
                    right: 20px;
                    background: white;
                    padding: 15px;
                    border-radius: 10px;
                    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
                    z-index: 9998;
                    min-width: 300px;
                ">
                    <h4 style="margin-top: 0; color: #333;">
                        <i class="fas fa-server"></i> Server Management
                    </h4>
                    
                    <div id="serverStatusDisplay">
                        <div class="loading">Checking servers...</div>
                    </div>
                    
                    <div style="margin-top: 15px; display: flex; gap: 10px; flex-direction: column;">
                        <button class="btn btn-sm btn-primary" onclick="syncLocalToOnline()">
                            <i class="fas fa-arrow-up"></i> Local → Online
                        </button>
                        <button class="btn btn-sm btn-warning" onclick="syncOnlineToLocal()">
                            <i class="fas fa-arrow-down"></i> Online → Local
                        </button>
                        <button class="btn btn-sm btn-info" onclick="checkAllServersStatus()">
                            <i class="fas fa-sync-alt"></i> Refresh Status

        // ✅ Update server status display
        async function checkAllServersStatus() {
            const servers = await checkAllServers();
            const display = document.getElementById('serverStatusDisplay');
            
            if (!display) return;
            
            let html = '';
            
            for (const [name, data] of Object.entries(servers)) {
                html += `
                    <div style="
                        display: flex;

                            <strong>${name === 'online' ? '🌍 Online' : '🏠 Local'}</strong>

                            </div>
                        </div>
                        <span style="
                            padding: 3px 8px;

        // ✅ Sync functions for UI
        async function syncLocalToOnline() {
            const result = await syncBetweenServers('local', 'online');
            
            if (result.success) {
                alert(`✅ ${result.message}`);
                checkAllServersStatus();
                optimizedLoadAdminData();
            } else {
                alert(`❌ Sync failed: ${result.error}`);
            }
        }

        async function syncOnlineToLocal() {
            const result = await syncBetweenServers('online', 'local');
            
            if (result.success) {
                alert(`✅ ${result.message}`);
                checkAllServersStatus();
                optimizedLoadAdminData();
            } else {
                alert(`❌ Sync failed: ${result.error}`);
            }
        }

        // ========================
        // ✅ OPTIMIZED VARIABLES
        // ========================
        let refreshTimers = {
            autoRefresh: null,
            serverStatus: null,
            fullSync: null,
            userSync: null
        };

        let lastRefreshTime = 0;
        let lastNotificationTime = 0;
        let isRefreshing = false;
        let refreshQueue = [];
        let notificationQueue = [];
        let userChangeCount = 0;

        // ========================
        // ✅ DEBOUNCE FUNCTIONS
        // ========================
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        // ========================
        // ✅ OPTIMIZED NOTIFICATION SYSTEM
        // ========================
        function showOptimizedNotification(message, type = 'info', force = false) {
            const now = Date.now();
            
            // Rate limiting
            if (!force) {
                if (type === 'info' && (now - lastNotificationTime < OPTIMIZATION_CONFIG.NOTIFICATION_COOLDOWN)) {
                    // Queue the notification
                    if (!notificationQueue.some(n => n.message === message)) {
                        notificationQueue.push({ message, type, timestamp: now });
                    }
                    return;
                }
                
                if (type === 'success' && (now - lastNotificationTime < OPTIMIZATION_CONFIG.SUCCESS_NOTIFICATION_COOLDOWN)) {
                    return;
                }
                
                if (type === 'error' && (now - lastNotificationTime < OPTIMIZATION_CONFIG.ERROR_NOTIFICATION_COOLDOWN)) {
                    return;
                }
            }
            
            lastNotificationTime = now;
            
            // Clear similar notifications
            const existingNotifications = document.querySelectorAll('.admin-notification');
            existingNotifications.forEach(notification => {
                if (notification.textContent.includes(message.substring(0, 30))) {
                    notification.remove();
                }
            });
            
            // Limit total notifications
            if (existingNotifications.length >= OPTIMIZATION_CONFIG.MAX_NOTIFICATIONS) {
                existingNotifications[0].remove();
            }
            
            // Create notification
            const notification = document.createElement('div');
            notification.className = `admin-notification notification-${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                <span style="flex: 1;">${message}</span>
                <button class="notification-close" onclick="this.parentElement.remove()" style="background: none; border: none; color: #666; cursor: pointer; font-size: 16px; padding: 0 5px;">
                    ×
                </button>
            `;
            
            document.getElementById('notificationContainer').appendChild(notification);
            
            // Auto-remove after appropriate time
            const removeTime = type === 'error' ? 8000 : type === 'info' ? 5000 : 4000;
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.style.animation = 'slideOut 0.3s ease-out forwards';
                    setTimeout(() => notification.remove(), 300);
                }
            }, removeTime);
            
            // Process queued notifications
            if (notificationQueue.length > 0) {
                setTimeout(() => {
                    const nextNotification = notificationQueue.shift();
                    if (nextNotification) {
                        showOptimizedNotification(nextNotification.message, nextNotification.type, true);
                    }
                }, OPTIMIZATION_CONFIG.NOTIFICATION_COOLDOWN);
            }
        }

        // ========================
        // ✅ OPTIMIZED REFRESH SYSTEM
        // ========================
        async function optimizedLoadAdminData(force = false) {
            const now = Date.now();
            const timeSinceLastRefresh = now - lastRefreshTime;
            
            // Rate limiting
            if (!force && timeSinceLastRefresh < 10000) { // 10 seconds minimum
                console.log('⏳ Skipping refresh (rate limited)');
                return;
            }
            
            // Check if already refreshing
            if (isRefreshing) {
                console.log('⏳ Already refreshing, queueing request');
                if (!refreshQueue.includes('loadAdminData')) {
                    refreshQueue.push('loadAdminData');
                }
                return;
            }
            
            isRefreshing = true;
            lastRefreshTime = now;
            
            try {
                showLoading();
                
                const serverBase = getServerBase();
                console.log('🔄 OPTIMIZED: Loading admin data from', serverBase);
                
                // Parallel fetching with error handling
                const [usersResponse, txResponse, statsResponse] = await Promise.allSettled([
                    fetch(`${serverBase}/api/get-all-users`).catch(() => ({ ok: false })),
                    fetch(`${serverBase}/api/get-all-transactions`).catch(() => ({ ok: false })),
                    fetch(`${serverBase}/api/admin/user-stats`).catch(() => ({ ok: false }))
                ]);
                
                // Process users
                if (usersResponse.status === 'fulfilled' && usersResponse.value.ok) {
                    const usersData = await usersResponse.value.json();
                    if (usersData.success) {
                        const filteredUsers = filterDeletedUsers(usersData.users);
                        const userCountChanged = filteredUsers.length !== adminData.users.length;
                        
                        adminData.users = filteredUsers;
                        document.getElementById('userCountBadge').textContent = filteredUsers.length;
                        
                        // Show notification only if significant change
                        if (userCountChanged && Math.abs(filteredUsers.length - adminData.users.length) > 5) {
                            showOptimizedNotification(`🔄 Users updated: ${filteredUsers.length} total`, 'info');
                        }
                    }
                }
                
                // Process transactions
                if (txResponse.status === 'fulfilled' && txResponse.value.ok) {
                    const txData = await txResponse.value.json();
                    if (txData.success) {
                        adminData.transactions = txData.transactions;
                        document.getElementById('txCountBadge').textContent = txData.transactions.length;
                    }
                }
                
                // Process stats
                if (statsResponse.status === 'fulfilled' && statsResponse.value.ok) {
                    const statsData = await statsResponse.value.json();
                    if (statsData.success) {
                        adminData.serverStats = statsData.stats;
                    }
                }
                
                adminData.lastUpdated = new Date();
                
                // Refresh view only if needed
                const currentView = document.querySelector('.admin-header h2').textContent;
                if (currentView.includes('Dashboard') || currentView.includes('Users')) {
                    refreshCurrentView();
                }
                
                if (!force) {
                    showOptimizedNotification('✅ Data refreshed', 'success');
                }
                
            } catch (error) {
                console.error('❌ Error in optimized load:', error);
                if (!force) {
                    showOptimizedNotification('⚠️ Refresh failed, using cached data', 'warning');
                }
            } finally {
                isRefreshing = false;
                
                // Process queued refreshes
                if (refreshQueue.length > 0) {
                    const nextRefresh = refreshQueue.shift();
                    setTimeout(() => optimizedLoadAdminData(), 5000);
                }
            }
        }

        // ========================
        // ✅ OPTIMIZED SYNC SETUP
        // ========================
        function setupOptimizedRealTimeSync() {
            console.log('🔧 Setting up OPTIMIZED real-time sync...');
            
            // Clear existing timers
            clearAllRefreshTimers();
            
            // Single auto-refresh timer

            window.addEventListener('focus', () => {

                if (now - lastFocusTime > 10000) { // 10 seconds cooldown
                    lastFocusTime = now;
                    debouncedRefresh();
                }
            });
            
            // Page visibility
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    debouncedRefresh();
                }
            });
            
            // Optimized storage events

                    userChangeCount++;

                    if (userChangeCount >= 3) {

        function processInBatches(array, batchSize, processFn) {
            const batches = [];
            for (let i = 0; i < array.length; i += batchSize) {
                batches.push(array.slice(i, i + batchSize));
            }
            
            return Promise.all(
                batches.map(batch => processFn(batch))
            );

                        if (table.dataset.loaded !== 'true') {

                            table.dataset.loaded = 'true';

                    }

            }, { threshold: 0.1 });
            
            // Observe all tables
            document.querySelectorAll('.table-container').forEach(container => {

                await originalLoad.apply(this, args);
                const end = performance.now();
                
                perfMetrics.loadTimes.push(end - start);
                perfMetrics.refreshCount++;
                
                // Keep only last 10 measurements
                if (perfMetrics.loadTimes.length > 10) {
                    perfMetrics.loadTimes.shift();
                }
                
                // Log performance every 10 refreshes
                if (perfMetrics.refreshCount % 10 === 0) {
                    const avgLoadTime = perfMetrics.loadTimes.reduce((a, b) => a + b, 0) / perfMetrics.loadTimes.length;
                    console.log(`📊 Performance: Avg load ${avgLoadTime.toFixed(2)}ms, ${perfMetrics.refreshCount} refreshes`);
                }
            };
            
            // Monitor notifications

        // ✅ Sync from all servers
        async function syncFromAllServers() {
            showOptimizedNotification('🔄 Syncing from all servers...', 'info');
            
            const allUsers = [];
            const allTransactions = [];
            const successfulServers = [];
            
            // Servers to sync from
            const servers = [
                { name: 'Local', url: 'http://localhost:3000' },
                { name: 'Online', url: 'https://tapearn-native-app.onrender.com' }
            ];
            
            for (const server of servers) {
                try {
                    console.log(`🔄 Attempting to sync from ${server.name}: ${server.url}`);
                    
                    // Try to get users from this server
                    const usersResponse = await fetch(`${server.url}/api/get-all-users`, {
                        mode: 'cors',
                        cache: 'no-cache'
                    }).catch(() => null);
                    
                    if (usersResponse && usersResponse.ok) {
                        const data = await usersResponse.json();
                        if (data.success) {
                            const users = data.users || data.data || [];
                            console.log(`✅ Got ${users.length} users from ${server.name}`);
                            
                            // Merge users (avoid duplicates by email or id)
                            users.forEach(user => {
                                const existingIndex = allUsers.findIndex(u => 
                                    u.email === user.email || u.id === user.id
                                );
                                
                                if (existingIndex === -1) {
                                    allUsers.push(user);
                                } else {
                                    // Update existing user with newer data
                                    const existingUser = allUsers[existingIndex];
                                    if (user.updatedAt > existingUser.updatedAt) {
                                        allUsers[existingIndex] = user;
                                    }
                                }
                            });
                            
                            // Try to get transactions
                            const txResponse = await fetch(`${server.url}/api/get-all-transactions`, {
                                mode: 'cors',
                                cache: 'no-cache'
                            }).catch(() => null);
                            
                            if (txResponse && txResponse.ok) {
                                const txData = await txResponse.json();
                                if (txData.success) {
                                    const transactions = txData.transactions || txData.data || [];
                                    
                                    // Merge transactions (avoid duplicates by transactionId)
                                    transactions.forEach(transaction => {
                                        const existingIndex = allTransactions.findIndex(t => 
                                            t.transactionId === transaction.transactionId
                                        );
                                        
                                        if (existingIndex === -1) {
                                            allTransactions.push(transaction);
                                        }
                                    });
                                }
                            }
                            
                            successfulServers.push(server.name);
                        }
                    }
                } catch (error) {
                    console.error(`❌ Error syncing from ${server.name}:`, error);
                }
            }
            
            // Update window data
            adminData = adminData || {};
            adminData.users = filterDeletedUsers(allUsers);
            adminData.transactions = allTransactions;
            adminData.lastUpdated = new Date();
            adminData.multiServerSync = true;
            
            // Update localStorage
            localStorage.setItem('registeredUsers', JSON.stringify(adminData.users));
            localStorage.setItem('allUsersTransactions', JSON.stringify(adminData.transactions));
            
            // Update UI counts
            document.getElementById('userCountBadge').textContent = adminData.users.length;
            document.getElementById('txCountBadge').textContent = adminData.transactions.length;
            
            showOptimizedNotification(
                `✅ Synced from ${successfulServers.length} server(s): ${adminData.users.length} users, ${adminData.transactions.length} transactions`,
                'success'
            );
            
            // Update UI
            refreshCurrentView();
            
            return {
                success: true,
                servers: successfulServers,
                userCount: adminData.users.length,
                transactionCount: adminData.transactions.length
            };
        }

        // Helper functions for Sponsor System
        function calculateSponsorLevels(sponsorMap) {
            let maxLevel = 0;
            for (const sponsorId in sponsorMap) {
                const level = calculateSponsorDepth(sponsorId, sponsorMap);
                maxLevel = Math.max(maxLevel, level);
            }
            return maxLevel;
        }

        function calculateSponsorDepth(sponsorId, sponsorMap, depth = 0, visited = new Set()) {
            if (visited.has(sponsorId)) return depth;
            visited.add(sponsorId);
            
            let maxDepth = depth;
            const sponsoredUsers = sponsorMap[sponsorId] || [];
            
            for (const user of sponsoredUsers) {
                if (sponsorMap[user.email || user.id]) {
                    const childDepth = calculateSponsorDepth(user.email || user.id, sponsorMap, depth + 1, visited);
                    maxDepth = Math.max(maxDepth, childDepth);
                }
            }
            
            return maxDepth;
        }

        // Sponsor Management Functions
        function assignRandomSponsors() {
            const usersWithoutSponsor = adminData.users.filter(u => 
                !u.sponsorId || u.sponsorId === 'none' || u.sponsorId === ''
            );
            
            const activeSponsors = adminData.users.filter(u => 
                u.status === 'active' && 
                u.emailVerified && 
                (u.sponsorId || u.sponsorId === '')
            );
            
            if (usersWithoutSponsor.length === 0) {
                showOptimizedNotification('✅ All users already have sponsors!', 'success');
                return;
            }
            
            if (activeSponsors.length === 0) {
                showOptimizedNotification('❌ No active sponsors available', 'error');
                return;
            }
            
            if (confirm(`Assign random sponsors to ${usersWithoutSponsor.length} users?`)) {
                let assigned = 0;
                
                usersWithoutSponsor.forEach(user => {
                    const randomSponsor = activeSponsors[Math.floor(Math.random() * activeSponsors.length)];
                    user.sponsorId = randomSponsor.email || randomSponsor.id;
                    assigned++;
                });
                
                // Update localStorage
                const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                registeredUsers.forEach((registeredUser, index) => {
                    const userToUpdate = usersWithoutSponsor.find(u => 
                        u.email === registeredUser.email || u.id === registeredUser.id
                    );
                    if (userToUpdate) {
                        registeredUsers[index].sponsorId = userToUpdate.sponsorId;

        function applyBulkSponsorChanges() {
            const selectedUsers = Array.from(document.getElementById('bulkUsers').selectedOptions).map(opt => opt.value);
            const newSponsorId = document.getElementById('newSponsor').value;
            const reason = document.getElementById('assignmentReason').value || 'Manual admin assignment';
            
            if (selectedUsers.length === 0) {
                showOptimizedNotification('❌ Please select at least one user', 'error');
                return;
            }
            
            let updated = 0;
            const changes = [];
            
            selectedUsers.forEach(userId => {
                const user = adminData.users.find(u => u.email === userId || u.id === userId);
                if (user) {
                    const oldSponsor = user.sponsorId;
                    user.sponsorId = newSponsorId || null;
                    changes.push({
                        userId,
                        oldSponsor,
                        newSponsor: newSponsorId || 'None',
                        reason
                    });
                    updated++;
                }
            });
            
            // Update localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
            registeredUsers.forEach(registeredUser => {
                const change = changes.find(c => c.userId === registeredUser.email || c.userId === registeredUser.id);
                if (change) {
                    registeredUser.sponsorId = change.newSponsor === 'None' ? null : change.newSponsor;
                }
            });
            localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
            
            // Log the changes
            const sponsorLog = JSON.parse(localStorage.getItem('sponsorChangeLog') || '[]');
            changes.forEach(change => {
                sponsorLog.push({
                    ...change,
                    timestamp: new Date().toISOString(),
                    admin: document.getElementById('adminUserName').textContent
                });
            });
            localStorage.setItem('sponsorChangeLog', JSON.stringify(sponsorLog));
            
            showOptimizedNotification(`✅ Updated sponsors for ${updated} users!`, 'success');
            closeModal();
            showSponsorSystem();
        }

        function generateSponsorReport() {
            const usersWithSponsor = adminData.users.filter(u => u.sponsorId && u.sponsorId !== 'none' && u.sponsorId !== '');
            const uniqueSponsors = [...new Set(usersWithSponsor.map(u => u.sponsorId))];
            
            const report = {
                generatedAt: new Date().toISOString(),
                totalUsers: adminData.users.length,
                usersWithSponsor: usersWithSponsor.length,
                uniqueSponsors: uniqueSponsors.length,
                commissionSettings: JSON.parse(localStorage.getItem('sponsorCommissionSettings') || '{}'),
                topSponsors: [],
                sponsorNetwork: {}
            };
            
            // Calculate top sponsors
            const sponsorCounts = {};
            usersWithSponsor.forEach(user => {
                sponsorCounts[user.sponsorId] = (sponsorCounts[user.sponsorId] || 0) + 1;
            });
            
            report.topSponsors = Object.entries(sponsorCounts)
                .map(([sponsorId, count]) => ({
                    sponsorId,
                    sponsoredCount: count,
                    sponsorData: adminData.users.find(u => u.email === sponsorId || u.id === sponsorId)
                }))
                .sort((a, b) => b.sponsoredCount - a.count)
                .slice(0, 20);
            
            // Create sponsor network
            usersWithSponsor.forEach(user => {
                if (!report.sponsorNetwork[user.sponsorId]) {
                    report.sponsorNetwork[user.sponsorId] = [];
                }
                report.sponsorNetwork[user.sponsorId].push({
                    userId: user.email || user.id,
                    username: user.username,
                    points: user.points,
                    status: user.status
                });
            });
            
            // Export as JSON
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sponsor_report_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showOptimizedNotification('✅ Sponsor report generated and downloaded!', 'success');
        }

        function fixSponsorIssues() {
            let issuesFixed = 0;
            
            // Fix 1: Remove self-referrals
            adminData.users.forEach(user => {
                if (user.sponsorId === (user.email || user.id)) {
                    user.sponsorId = null;
                    issuesFixed++;
                }
            });
            
            // Fix 2: Remove invalid sponsor IDs
            adminData.users.forEach(user => {
                if (user.sponsorId && user.sponsorId !== 'none') {
                    const sponsorExists = adminData.users.some(u => 
                        u.email === user.sponsorId || u.id === user.sponsorId
                    );
                    if (!sponsorExists) {
                        user.sponsorId = null;
                        issuesFixed++;
                    }
                }
            });
            
            // Fix 3: Fix duplicate sponsors
            const sponsorMap = {};
            adminData.users.forEach(user => {
                if (user.sponsorId) {
                    if (!sponsorMap[user.sponsorId]) {
                        sponsorMap[user.sponsorId] = [];
                    }
                    sponsorMap[user.sponsorId].push(user);
                }
            });
            
            // Update localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
            registeredUsers.forEach((registeredUser, index) => {
                const updatedUser = adminData.users.find(u => 
                    u.email === registeredUser.email || u.id === registeredUser.id
                );
                if (updatedUser) {
                    registeredUsers[index].sponsorId = updatedUser.sponsorId;
                }
            });
            localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
            
            showOptimizedNotification(`✅ Fixed ${issuesFixed} sponsor issues!`, 'success');
            showSponsorSystem();
        }

        async function saveUserEdit(userId) {
            const username = document.getElementById('editUsername').value;

            const points = parseInt(document.getElementById('editPoints').value) || 0;
            const usdt = parseFloat(document.getElementById('editUSDT').value) || 0;

            if (userIndex === -1) {
                showOptimizedNotification('User not found', 'error');

            const updatedUser = {
                ...adminData.users[userIndex],
                username: username,
                email: email,
                points: points,
                usdtWallet: usdt,
                inrWallet: inr,
                status: status,
                emailVerified: verified
            };

            adminData.users[userIndex] = updatedUser;
            
            // Update localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');

                u.email === userId || u.id === userId || u.username === userId
            );
            
            if (localUserIndex !== -1) {

                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));

            showOptimizedNotification('✅ User updated successfully!', 'success');
            closeModal();
            showUsers();
        }

        function createBackup() {
            const backup = {
                users: adminData.users,
                transactions: adminData.transactions,
                miningPools: JSON.parse(localStorage.getItem('miningPools') || '[]'),
                referralCodes: JSON.parse(localStorage.getItem('allReferrals') || '[]'),
                deletedUsers: JSON.parse(localStorage.getItem('deletedUsers') || '[]'),
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem('tapearn_backup_' + new Date().toISOString().split('T')[0], JSON.stringify(backup));
            showOptimizedNotification('✅ Backup created successfully!', 'success');
        }

        function restoreBackup() {
            if (confirm('Restore from backup? This will overwrite current data.')) {
                const backupKeys = Object.keys(localStorage).filter(key => key.startsWith('tapearn_backup_'));
                if (backupKeys.length > 0) {
                    const latestBackup = backupKeys[backupKeys.length - 1];
                    const backup = JSON.parse(localStorage.getItem(latestBackup));
                    
                    // Restore data
                    adminData.users = backup.users || [];
                    adminData.transactions = backup.transactions || [];
                    localStorage.setItem('registeredUsers', JSON.stringify(backup.users || []));
                    localStorage.setItem('allUsersTransactions', JSON.stringify(backup.transactions || []));
                    if (backup.miningPools) localStorage.setItem('miningPools', JSON.stringify(backup.miningPools));
                    if (backup.referralCodes) localStorage.setItem('allReferrals', JSON.stringify(backup.referralCodes));
                    if (backup.deletedUsers) localStorage.setItem('deletedUsers', JSON.stringify(backup.deletedUsers));
                    
                    showOptimizedNotification(`✅ Restored from backup: ${latestBackup}`, 'success');
                    showDashboard();
                } else {
                    showOptimizedNotification('❌ No backups found!', 'error');
                }
            }
        }

            const miningPools = JSON.parse(localStorage.getItem('miningPools') || '[]');

            try {

                    console.log('Server status: OK');
                } else {
                    console.log('Server status: ERROR');
                }
            } catch (error) {
                console.log('Server status: OFFLINE');
            }
